name: Sample suite emulator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-suite:
    name: API 35 sample suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the FlowScope CLI
        run: ./gradlew :recorder-host:installDist --stacktrace

      - name: Publish the current agents to Maven Local
        working-directory: android-agent
        run: ./gradlew :agent:publishToMavenLocal :agent-noop:publishToMavenLocal --stacktrace

      - name: Run the sample regression suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot-save
          script: |
            set -euo pipefail
            reports="$RUNNER_TEMP/flowscope-sample-reports"
            mkdir -p "$reports"

            ./examples/sample-app/gradlew -p examples/sample-app \
              :app:installDebug -PuseMavenLocal=true --refresh-dependencies --stacktrace

            serial="$(adb devices | awk 'NR > 1 && $2 == "device" { print $1; exit }')"
            if [ -z "$serial" ]; then
              echo "No booted Android emulator was found" >&2
              exit 1
            fi

            cli="./recorder-host/build/install/flowscope/bin/flowscope"
            if ! "$cli" suite run flows/suites/sample.suite \
              --project examples --serial "$serial" --output "$reports"; then
              package_uid="$(adb -s "$serial" shell cmd package list packages -U \
                io.github.flowscopedev.sample \
                | sed -n 's/.* uid:\([0-9][0-9]*\).*/\1/p' | head -n 1 | tr -d '\r')"
              if [ -n "$package_uid" ]; then
                adb -s "$serial" logcat -d --uid="$package_uid" \
                  > "$RUNNER_TEMP/sample-suite-logcat.txt" || true
              fi
              exit 1
            fi

      - name: Upload FlowScope reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sample-suite-api-35
          path: |
            ${{ runner.temp }}/flowscope-sample-reports/
            ${{ runner.temp }}/sample-suite-logcat.txt
          if-no-files-found: warn
          retention-days: 14
