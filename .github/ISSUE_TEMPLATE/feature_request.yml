name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        FlowScope's `.flow` language and CLI are intentionally small and stable, so please describe
        the problem first. Test execution must never need an AI model, an IDE or app source code.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: For a flow action, a short example of the syntax helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this
